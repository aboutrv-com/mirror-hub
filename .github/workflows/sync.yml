name: Mirror sync

on:
  schedule:
    - cron: '17 3 * * *'   # daily at 03:17 UTC, off-peak
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      only:
        description: "Run only mirrors whose src/dst contains this text (blank = all)"
        type: string
        default: ""
      debug:
        description: "Verbose git tracing (GIT_TRACE)"
        type: boolean
        default: false

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  # Read mirrors.txt and turn it into a job matrix.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          # Columns: src dst [fallback]. Collapse runs of whitespace to a
          # single space so jq can split cleanly; fallback is optional.
          # A manual run may pass `only` to filter to matching mirrors (substring
          # match on the whole line) — handy for debugging one repo in isolation.
          lines=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' mirrors.txt)
          if [ -n "$ONLY" ]; then
            # Substring filter. grep exiting 1 (no match) is fine here — we
            # want an empty result, not a fallthrough to all lines.
            lines=$(printf '%s\n' "$lines" | grep -F "$ONLY" || true)
          fi
          matrix=$(printf '%s\n' "$lines" \
            | awk 'NF {print $1, $2, $3}' \
            | jq -R -s -c 'split("\n") | map(select(length>0))
                | map(split(" ") | {src: .[0], dst: .[1], fallback: (.[2] // "")})
                | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Parsed matrix (only='$ONLY'): $matrix"

  # One independent job per mirror; a failure in one does not affect others.
  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    timeout-minutes: 120
    steps:
      - name: Compute cache slug
        id: slug
        run: echo "s=$(echo '${{ matrix.dst }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore mirror cache
        uses: actions/cache@v6
        with:
          path: repo.git
          key: mirror-${{ steps.slug.outputs.s }}-${{ github.run_id }}
          restore-keys: mirror-${{ steps.slug.outputs.s }}-

      - name: Fetch from source
        shell: bash
        env:
          SRC: ${{ matrix.src }}
          FALLBACK: ${{ matrix.fallback }}
        run: |
          set -uo pipefail
          # Candidate URLs for the SAME repo, tried in order. The fallback
          # (e.g. git://) exists because sourceware.org HTTP frequently returns
          # 429 under the concurrent cold clones of a matrix run; the git daemon
          # (port 9418) doesn't share that HTTPS rate limiter.
          urls=("$SRC"); [ -n "$FALLBACK" ] && urls+=("$FALLBACK")

          # One fetch attempt against a given URL. Incremental if the cache is
          # warm, otherwise a fresh mirror clone. On the incremental path we
          # retarget the remote to $1 so a fallback URL is actually used.
          try_fetch() {   # $1 = url
            if [ -d repo.git ]; then
              echo "Cache hit — incremental fetch from $1"
              git -C repo.git remote set-url origin "$1"
              git -C repo.git remote update --prune
            else
              echo "Cache miss — fresh mirror clone from $1 (slow first run)"
              git clone --mirror "$1" repo.git
            fi
          }

          # Try each URL with exponential backoff (30s/60s/120s) — backoff is
          # what actually clears a 429, protocol switch is the second lever.
          for url in "${urls[@]}"; do
            n=0
            while :; do
              if try_fetch "$url"; then
                echo "Fetch OK from $url"; exit 0
              fi
              # A failed clone can leave a partial repo.git that would make the
              # next attempt take the (wrong) incremental path — clear it.
              [ -d repo.git ] && ! git -C repo.git rev-parse --git-dir >/dev/null 2>&1 && rm -rf repo.git
              n=$((n+1))
              [ "$n" -ge 3 ] && { echo "::warning::$url failed after $n attempts"; break; }
              d=$((30 * (1 << (n-1))))   # 30, 60, 120
              echo "$url attempt $n failed, retry in ${d}s..."; sleep "$d"
            done
          done
          echo "::error::all sources failed for ${{ matrix.dst }} — will retry next run"
          exit 1

      # Minted AFTER the (potentially long) clone/fetch, so the token's ~1h
      # lifetime is reserved entirely for the steps that use it (create repo,
      # push, default-branch). A slow cold clone of a large repo (gcc/glibc)
      # can otherwise outlast a token minted up front, causing a 401 on push.
      - name: Generate installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MIRROR_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Ensure destination repo exists
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh repo view "${{ matrix.dst }}" >/dev/null 2>&1; then
            echo "Creating ${{ matrix.dst }}"
            gh repo create "${{ matrix.dst }}" --public \
              --description "Unofficial mirror · auto-synced by github.com/${{ github.repository }} · not affiliated with upstream"
          fi
          # Mirrored upstreams carry their own .github/workflows/*.yml. We push
          # those verbatim (the App has workflows:write), but they are NOT ours to
          # run — a mirror must never execute upstream CI. Disable Actions on the
          # destination so the workflow files exist as inert copies and never burn
          # our minutes or fire on push. This PUT is idempotent, so we run it every
          # sync: it also covers repos created before this step existed.
          echo "Ensuring Actions are disabled on ${{ matrix.dst }} (mirror must not run upstream CI)"
          gh api -X PUT "repos/${{ matrix.dst }}/actions/permissions" \
            -F enabled=false >/dev/null
          # GitHub's native "Public mirror" badge is driven by a read-only
          # mirror_url field we can't set (it belongs to GitHub's internal
          # importer). The closest self-serve signal is repo topics, which show
          # under the repo name. Set them so visitors see this is an unofficial
          # mirror. This PUT replaces the whole topic set, so it's idempotent and
          # safe to run every sync (also backfills repos created earlier).
          echo "Tagging ${{ matrix.dst }} with mirror topics"
          gh api -X PUT "repos/${{ matrix.dst }}/topics" \
            -f "names[]=mirror" -f "names[]=unofficial-mirror" >/dev/null
          # Point the repo's "Website" field (homepage) at the upstream source
          # URL, so the About box shows a clickable link back to the real repo
          # (the description text isn't a link). Also (re)set the description so
          # it stops duplicating the homepage URL and instead tells visitors the
          # mirror is auto-maintained by this open-source project. Idempotent
          # PATCH, run every sync — backfills repos created before this changed.
          echo "Setting homepage + description on ${{ matrix.dst }}"
          gh api -X PATCH "repos/${{ matrix.dst }}" \
            -f "homepage=${{ matrix.src }}" \
            -f "description=Unofficial mirror · auto-synced by github.com/${{ github.repository }} · not affiliated with upstream" >/dev/null

      - name: Push mirror (branches + tags, pruned)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -uo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ matrix.dst }}.git"
          GIT="git -C repo.git -c http.version=HTTP/1.1"

          # Visibility: --progress forces git to emit transfer progress even
          # though CI stderr is not a TTY (it's otherwise auto-suppressed). The
          # optional debug toggle turns on full git/curl tracing. We NEVER echo
          # $url (it embeds the token) — git's own output uses the clean remote.
          PROGRESS="--progress"
          if [ "${{ inputs.debug }}" = "true" ]; then
            # GIT_TRACE alone is safe. We deliberately do NOT set
            # GIT_CURL_VERBOSE — it dumps HTTP headers including the
            # Authorization bearer token into the public log.
            export GIT_TRACE=1
            echo "::notice::debug tracing enabled (GIT_TRACE)"
          fi
          # How many refs are we about to push? Gives the per-ref loop a
          # denominator so progress reads "42/930" instead of silence.
          n_heads=$($GIT for-each-ref --format='x' refs/heads | wc -l | tr -d ' ')
          n_tags=$($GIT for-each-ref --format='x' refs/tags | wc -l | tr -d ' ')
          echo "Mirroring ${{ matrix.dst }}: $n_heads branches, $n_tags tags"

          # We push refs/heads/* and refs/tags/* (not --mirror: some upstreams
          # carry non-standard refs like refs/remotes/*). --force is required for
          # true mirror semantics: tags are immutable to a normal push, so once a
          # tag exists on the remote git refuses to update it ("already exists");
          # --force makes the destination track upstream exactly (also follows
          # upstream branch force-pushes/rebases). HTTP/1.1 avoids sporadic
          # HTTP/2 500s on large ref batches.
          #
          # Old imported repos (CVS-era: dejagnu, binutils-gdb) can contain
          # malformed objects (e.g. a tagger line with no date). GitHub enforces
          # receive.fsckObjects and rejects the WHOLE pack, so one bad object
          # fails every ref. When we detect that, fall back to per-ref pushes and
          # skip only the refs the remote refuses. (Per-ref loses --prune; the
          # daily batch path handles pruning on healthy syncs.)
          fsck_err='fsck|invalid author|invalid committer|missingSpaceBeforeDate|unpack failed'

          push_per_ref() {   # $1 = namespace, $2 = total count for progress
            local ref pushed=0 salvaged=0 skipped=0 done=0 total="$2" tgt err
            while read -r ref; do
              [ -z "$ref" ] && continue
              done=$((done+1))
              # Capture stderr so a failure shows WHY, instead of vanishing into
              # /dev/null. On success we stay quiet (one summary line at the end)
              # but print a heartbeat every 100 refs so long tag runs aren't dark.
              if err=$($GIT push --force "$url" "$ref:$ref" 2>&1); then
                pushed=$((pushed+1))
                [ $((done % 100)) -eq 0 ] && echo "  ...$done/$total pushed"
                continue
              fi
              # A rejected annotated tag often has a broken tag shell (bad tagger
              # line) wrapping a healthy commit. Salvage it as a lightweight tag
              # pointing at that commit — the ref survives and still points to the
              # right revision; only the tag's own message/signature is dropped.
              if [ "${ref#refs/tags/}" != "$ref" ] \
                 && tgt=$($GIT rev-parse --verify -q "$ref^{commit}") \
                 && $GIT push --force "$url" "$tgt:$ref" >/dev/null 2>&1; then
                echo "::warning::$ref had a malformed tag object — mirrored as lightweight tag"
                salvaged=$((salvaged+1))
              else
                # Show the first line of the real rejection reason.
                echo "::warning::remote rejected $ref — skipped: $(echo "$err" | grep -iE 'error|reject|fatal|fsck' | head -1)"
                skipped=$((skipped+1))
              fi
            done < <($GIT for-each-ref --format='%(refname)' "$1")
            echo "$1: pushed=$pushed salvaged=$salvaged skipped=$skipped (of $total)"
          }

          sync_ns() {        # $1 = refspec, $2 = namespace, $3 = ref count
            local n=0 log rc
            log=$(mktemp)
            while :; do
              # Full output -> $log (for fsck grep). Displayed stream is
              # throttled so a big push is a heartbeat, not a flood: split
              # git's \r progress refreshes into lines, then show only every
              # 40th progress line while ALWAYS passing through real messages
              # (remote:, errors, "Writing objects" 100%, summaries).
              $GIT push $PROGRESS --prune --force "$url" "$1" 2>&1 \
                | tee "$log" \
                | tr '\r' '\n' \
                | awk '/[0-9]+%/ { c++; if (c % 40 == 0 || /100%/) print "  "$0; next } { print }'
              rc=${PIPESTATUS[0]}
              if [ "$rc" -eq 0 ]; then
                echo "$2: batch push OK ($3 refs)"; rm -f "$log"; return 0
              fi
              if grep -qiE "$fsck_err" "$log"; then
                echo "$2: bad objects in pack — switching to per-ref"
                push_per_ref "$2" "$3"; rm -f "$log"; return 0
              fi
              n=$((n+1))
              [ "$n" -ge 3 ] && { echo "::error::$2 push failed after $n tries"; rm -f "$log"; return 1; }
              echo "$2 push attempt $n failed, retry in $((n*15))s..."; sleep $((n*15))
            done
          }

          rc=0
          sync_ns 'refs/heads/*:refs/heads/*' refs/heads "$n_heads" || rc=1
          sync_ns 'refs/tags/*:refs/tags/*'   refs/tags  "$n_tags"  || rc=1
          exit $rc

      - name: Sync default branch to match upstream HEAD
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # Upstream HEAD is the source of truth for the default branch. Without
          # this, a freshly created repo defaults to whichever branch GitHub saw
          # first on push (e.g. PR44602), which is wrong. Runs after the push so
          # the target branch is guaranteed to exist on the remote.
          head_branch=$(git -C repo.git symbolic-ref --short HEAD 2>/dev/null || true)
          if [ -z "$head_branch" ]; then
            echo "No upstream HEAD branch detected — leaving default as-is."
            exit 0
          fi
          current=$(gh repo view "${{ matrix.dst }}" --json defaultBranchRef \
            --jq '.defaultBranchRef.name' 2>/dev/null || true)
          if [ "$current" = "$head_branch" ]; then
            echo "Default branch already '$head_branch'."
          else
            echo "Setting default branch: '$current' -> '$head_branch'"
            gh api -X PATCH "repos/${{ matrix.dst }}" -f "default_branch=$head_branch" >/dev/null
            echo "Default branch set to $head_branch"
          fi
